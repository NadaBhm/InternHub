spring.application.name=internhub
server.port=${PORT:8080}

# MySQL (local defaults; use environment variables for hosted databases)
spring.datasource.url=${INTERNHUB_DB_URL:jdbc:mysql://localhost:3306/internhubdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${INTERNHUB_DB_USERNAME:root}
spring.datasource.password=${INTERNHUB_DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configure a stable, secret value (at least 32 characters) outside source control for deployments.
app.jwt.secret=${INTERNHUB_JWT_SECRET:}
app.jwt.expiration-ms=${INTERNHUB_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${INTERNHUB_ALLOWED_ORIGINS:http://localhost:4200}
app.bootstrap-admin.email=${INTERNHUB_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${INTERNHUB_BOOTSTRAP_ADMIN_PASSWORD:}
app.demo-data=${INTERNHUB_DEMO_DATA:true}
app.upload-dir=${INTERNHUB_UPLOAD_DIR:uploads}

# Registration notifications are sent when SMTP and an admin email are configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.admin-email=${INTERNHUB_ADMIN_EMAIL:}
